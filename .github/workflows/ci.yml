name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run on demand. A run that fails at startup (e.g. an Actions
  # policy blocks one of the `uses:` above) cannot be retried from the UI, and
  # without this the only way to get a fresh run is another commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test (stdio MCP handshake)
        run: node test/smoke.mjs

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # trufflehog is a system-installed binary (not present on the runner);
          # the zero-dependency detect-private-key gate still runs.
          SKIP: trufflehog
