name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the environment configured in the npm Trusted Publisher
    # (npmjs.com -> nexthink-mcp-server -> Settings -> Trusted Publisher).
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test (stdio MCP handshake)
        run: node test/smoke.mjs

      # Auth is npm Trusted Publishing (GitHub OIDC) — no token secret.
      # Requires npm >= 11.5.1 (Node 24 bundles a compatible npm) and the
      # id-token: write permission above.
      #
      # NOTE: a provenance attestation requires a PUBLIC source repository.
      # It is produced automatically when this repo is public, and silently
      # unavailable while it is private. See CONTRIBUTING.md.
      #
      # npm applies the "latest" dist-tag by default, regardless of a semver
      # pre-release suffix. Without this a pre-release would become the version
      # `npx nexthink-mcp-server` serves to everyone, so pre-releases go to
      # "next" and only a full release moves "latest".
      - name: Publish
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
