# Pre-commit hooks for nexthink-mcp-server.
#
# Scoped to this repo's pure TypeScript/Node (ESM) stack: fast, commit-time
# hygiene plus a secret-scan baseline. There is no Terraform or generated spec
# set here, so no gates for those.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#   # trufflehog (secret scanner):
#   #   macOS/Linux: brew install trufflehog
#   #   Windows:     winget install trufflesecurity.trufflehog  (or) choco install trufflehog
#
# Run on demand:
#   pre-commit run --all-files
#
# These are fast, commit-time gates. Heavier checks (typecheck, full test suite)
# run in CI (.github/workflows/ci.yml); mirror them locally with:
#   npm run typecheck && npm test
#
# package-lock.json is generated and dist/ is build output — excluded so the
# hygiene hooks stay focused on this repo's own source.
#
# `.squad/` is local agent tooling. It is gitignored, and still tracked at the
# time of writing pending removal from this repo. Either way a working copy may
# carry it while these hooks run, and it is vendored verbatim — linting its
# whitespace or flagging the placeholder key in its secret-handling docs would
# be noise, not signal. A non-matching exclude is a harmless no-op, so this
# line stays correct once the directory is gone.

exclude: '^(\.squad/|package-lock\.json$|dist/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-json
        exclude: ^(tsconfig.*\.json|\.vscode/.*\.json)$   # these allow comments (JSONC)
      - id: check-yaml
      - id: detect-private-key   # zero-dependency secret baseline (works without trufflehog)
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: trufflehog
        name: trufflehog (secret scan)
        description: >
          Scans staged files for verified/unknown secrets before commit.
          Install per the header above; if trufflehog is absent the hook errors
          with an install hint (detect-private-key still provides a baseline).
        entry: trufflehog git file://. --since-commit HEAD --no-update --fail --results=verified,unknown --exclude-paths=.trufflehogignore
        language: system
        pass_filenames: false
